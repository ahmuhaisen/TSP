<!-- Loading Spinner (shown when event is loading) -->
<div *ngIf="isEventLoading" class="fixed inset-0 flex items-center justify-center z-50 bg-black/70">
    <div class="bg-white rounded-2xl p-8 shadow-2xl flex flex-col items-center max-w-md">
        <nz-spin nzSize="large"></nz-spin>
        <p class="mt-4 text-gray-700 text-lg">Loading event details...</p>
    </div>
</div>

<div *ngIf="!isEventLoading && !isEventAvailable()">
    <div class="h-[calc(100vh-64px)] flex items-center justify-center">
        <div class="bg-white rounded-2xl p-8 flex flex-col items-center max-w-md">
            <nz-icon nzType="exclamation-circle" nzTheme="outline" class="text-4xl text-red-500"></nz-icon>
            <p class="mt-4 text-gray-700 text-lg">{{notAvailableMessage()}}</p>
        </div>
    </div>
</div>


<!-- Main Content (shown only when event is loaded) -->
<ng-container *ngIf="!isEventLoading && isEventAvailable()">
    <!-- Hero Section -->
    <app-event-hero [event]="eventDetails" [theme]="'blue'" [PageTitle]="'Event Registration'" />

    <!-- Sticky Info Bar -->
    <app-sticky-info-bar [event]="eventDetails" [title]="'Event Registration'" />

    <!-- Event Info Bar -->
    <app-event-info-bar [event]="eventDetails" />

    <!-- Main Content -->
    <div class="relative pb-20">
        <div class="container mx-auto px-4 md:px-8">
            <!-- Content Cards -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mt-8">
                <!-- Registration Form -->
                <div class="lg:col-span-8">
                    <app-registration-form #registrationFormComponent [eventId]="eventId" [userDetails]="userDetails"
                        [isLoggedIn]="isLoggedIn" [isLoading]="isLoading" [isSubmitting]="isSubmitting"
                        [isRegisterSucceeded]="isRegisterSucceeded" [registrationType]="registrationType"
                        [schoolMajorOptions]="nzOptions" [isFaculty]="authService.isFacultyMember()"
                        (refreshUserDetailsEvent)="forceRefreshUserDetails()"
                        (selectRegistrationTypeEvent)="selectRegistrationType($event)"
                        (submitRegistrationEvent)="onSubmit()">
                    </app-registration-form>
                </div>

                <!-- Event Details -->
                <div class="lg:col-span-4">
                    <app-event-details [event]="eventDetails"></app-event-details>
                </div>
            </div>
        </div>
    </div>


</ng-container>

<!-- Footer -->
<footer *ngIf="!isEventLoading" class="bg-slate-100 py-9 border-t-2">
    <div class="container mx-auto px-4 md:px-8 text-center">
        <img src="tsp-logo.png" alt="Logo" class="w-16 mx-auto mb-6">
        <p class="text-sm text-gray-700">&copy; {{currentYear}} The Societies Portal.</p>
    </div>
</footer>
