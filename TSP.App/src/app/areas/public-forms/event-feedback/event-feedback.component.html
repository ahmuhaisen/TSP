<!-- Loading Spinner (shown when event is loading) -->
<div *ngIf="isEventLoading" class="fixed inset-0 flex items-center justify-center z-50 bg-black/70">
    <div class="bg-white rounded-2xl p-8 shadow-2xl flex flex-col items-center max-w-md">
        <nz-spin nzSize="large"></nz-spin>
        <p class="mt-4 text-gray-700 text-lg">Loading event details...</p>
    </div>
</div>

<!-- Event Not Available Message -->
<div *ngIf="!isEventLoading && !isEventAvailable()">
    <div class="h-[calc(100vh-64px)] flex items-center justify-center">
        <div class="bg-white rounded-2xl p-8 flex flex-col items-center max-w-md">
            <nz-icon nzType="exclamation-circle" nzTheme="outline" class="text-4xl text-red-500"></nz-icon>
            <p class="mt-4 text-gray-700 text-lg text-center">{{notAvailableMessage()}}</p>
        </div>
    </div>
</div>

<!-- Main Content (shown only when event is loaded) -->
<ng-container *ngIf="!isEventLoading && isEventAvailable()">
    <!-- Hero Section -->
    <app-event-hero [event]="eventDetails" [PageTitle]="'Event Feedback'" [theme]="'purple'"></app-event-hero>

    <!-- Sticky Info Bar -->
    <app-sticky-info-bar [event]="eventDetails" [title]="'Event Feedback'"/>

    <!-- Event Info Bar
    <app-event-info-bar [event]="eventDetails"></app-event-info-bar> -->

    <!-- Main Content -->
    <div class="relative pb-20">
        <div class="container mx-auto px-4 md:px-8">
            <!-- Content Cards -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mt-8">
                <!-- Feedback Form -->
                <div class="lg:col-span-8">
                    <div class="bg-white rounded-lg shadow-lg p-8">
                        <div *ngIf="!isSubmitSucceeded">
                            <h2 class="text-2xl font-bold text-gray-800 mb-6">Event Feedback</h2>
                            <p class="text-gray-600 mb-6">Your feedback is anonymous and helps us improve future events. Thank you for taking the time to share your thoughts!</p>
                            
                            <form [formGroup]="feedbackForm" (ngSubmit)="onSubmit()">
                                <!-- Rating Section -->
                                <div class="mb-8">
                                    <label class="block text-gray-700 text-lg font-semibold mb-3">How would you rate this event?</label>
                                    <nz-form-item>
                                        <nz-form-control [nzErrorTip]="'Please rate the event'">
                                            <nz-rate formControlName="rating" nzAllowHalf />
                                        </nz-form-control>
                                    </nz-form-item>
                                </div>
                                
                                <!-- Notes Section -->
                                <div class="mb-8">
                                    <label class="block text-gray-700 text-lg font-semibold mb-3">Additional Comments (Optional)</label>
                                    <nz-form-item>
                                        <nz-form-control>
                                            <textarea 
                                                formControlName="notes" 
                                                nz-input 
                                                rows="4" 
                                                placeholder="Share your thoughts about the event..."
                                                class="w-full rounded-lg"></textarea>
                                        </nz-form-control>
                                    </nz-form-item>
                                </div>
                                
                                <!-- Submit Button -->
                                <div class="flex justify-center">
                                    <button 
                                        nz-button 
                                        nzType="primary" 
                                        nzSize="large"
                                        [nzLoading]="isSubmitting" 
                                        [disabled]="feedbackForm.invalid"
                                        class="px-8 py-2 rounded-lg">
                                        Submit Feedback
                                    </button>
                                </div>
                            </form>
                        </div>
                        
                        <!-- Success Message -->
                        <div *ngIf="isSubmitSucceeded" class="text-center py-12">
                            <nz-icon nzType="check-circle" nzTheme="outline" class="text-6xl text-green-500 mb-4"></nz-icon>
                            <h2 class="text-2xl font-bold text-gray-800 mb-3">Thank You!</h2>
                            <p class="text-gray-600">Your feedback has been submitted successfully.</p>
                        </div>
                    </div>
                </div>

                <!-- Event Details -->
                <div class="lg:col-span-4">
                    <app-event-details [event]="eventDetails"></app-event-details>
                </div>
            </div>
        </div>
    </div>
</ng-container>

<!-- Footer -->
<footer *ngIf="!isEventLoading" class="bg-slate-100 py-9 border-t-2">
    <div class="container mx-auto px-4 md:px-8 text-center">
        <img src="tsp-logo.png" alt="Logo" class="w-16 mx-auto mb-6">
        <p class="text-sm text-gray-700">&copy; {{currentYear}} The Societies Portal.</p>
    </div>
</footer>
