<nav class="bg-slate-50 border-b-1 border-gray-200 py-2.5 shadow sticky top-0 z-50">
    <div class="flex flex-wrap items-center justify-between max-w-screen-xl px-4 mx-auto">
        <a href="#" class="flex items-center">
            <img src="tsp-logo.png" class="h-6 mr-2 sm:h-8" alt="The Societies Portal">
            <span class="self-center text-xl font-semibold whitespace-nowrap text-gray-700">TSP</span>
        </a>
        <div class="flex items-center lg:order-2 relative">
            <!-- Notifications -->
            <app-notifications />
            <!-- My Account -->
            <app-account-details />
            <button (click)="toggleMenu()"
                class="inline-flex items-center p-2 ml-1 text-sm text-gray-500 rounded-lg lg:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
                aria-controls="mobile-menu-2" aria-expanded="false">
                <span class="sr-only">Open main menu</span>
                <svg *ngIf="!isMenuOpen" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                        clip-rule="evenodd"></path>
                </svg>
                <svg *ngIf="isMenuOpen" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"
                    xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd"></path>
                </svg>
            </button>
        </div>
        @if(isMenuOpen || isLargeScreen){
        <div class="items-center justify-between w-full lg:flex lg:w-auto lg:order-1" id="mobile-menu-2">
            <ul class="flex flex-col mt-4 font-medium lg:flex-row lg:space-x-8 lg:mt-0">
                @for(item of navbarItems; track $index){
                <li>
                    <a [routerLink]="'./' + item.targetPagePath" routerLinkActive="active" (click)="toggleMenu()"
                        class="block py-2 pl-3 pr-4 text-gray-700 border-b border-gray-100 hover:bg-gray-50 lg:hover:bg-transparent lg:border-0 lg:hover:text-primary-dark lg:p-0"
                        aria-current="page">
                        <nz-icon *ngIf="item.iconName" [nzType]="item.iconName" class="mr-1"></nz-icon>
                        {{ item.name }}
                    </a>
                </li>
                }
            </ul>
        </div>
        }
    </div>
</nav>
