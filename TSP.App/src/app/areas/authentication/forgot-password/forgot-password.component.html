<div class="text-center mb-6 md:mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Forgot Password</h1>
    <p class="text-sm md:text-base text-gray-600 mt-2">
        Enter your email address and we'll send you instructions to reset your password.
    </p>
</div>

<div class="bg-blue-50 p-4 sm:p-6 rounded-lg border border-blue-100">
    <form nz-form [formGroup]="forgotPasswordForm" class="space-y-4 md:space-y-5" (ngSubmit)="submitForm()">
        <nz-form-item>
            <nz-form-control nzErrorTip="Please enter a valid email!">
                <nz-input-group nzPrefixIcon="mail" nzSize="large" class="rounded-lg">
                    <input type="text" nz-input formControlName="email" placeholder="Email" class="py-2 md:py-2.5"/>
                </nz-input-group>
            </nz-form-control>
        </nz-form-item>
        
        <button nz-button class="w-full h-10 md:h-12 rounded-lg shadow-lg transform hover:scale-[1.02] transition-all duration-300 text-white font-medium text-sm md:text-base bg-gradient-to-r from-blue-600 to-indigo-500 hover:from-blue-700 hover:to-indigo-600 border-0" 
            [nzSize]="'large'" 
            [nzType]="'primary'"
            [nzLoading]="isLoading">
            Send Reset Instructions
        </button>

        <div class="text-center mt-4">
            <a routerLink="../login" class="text-sm text-gray-600 hover:text-gray-800 font-medium transition-colors duration-300">
                Back to Login
            </a>
        </div>
    </form>
</div>
