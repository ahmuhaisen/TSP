<div class="text-center mb-6 md:mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Welcome Back</h1>
    <p class="text-sm md:text-base text-gray-600 mt-2">
        Don't have an account?
        <a routerLink="../register" class="text-gray-600 hover:text-gray-800 font-medium transition-colors duration-300">
            Sign up
        </a>
    </p>
</div>

<div class="mb-5 md:mb-6 flex justify-center">
    <nz-segmented [nzOptions]="userTypes" (nzValueChange)="onUserTypeChange($event)" class="shadow-sm text-xs sm:text-sm"></nz-segmented>
</div>

<div [class]="selectedUserType === 'Student' ? 'bg-orange-50 p-4 sm:p-6 rounded-lg border border-orange-100' : 'bg-blue-50 p-4 sm:p-6 rounded-lg border border-blue-100'">
    <form nz-form [formGroup]="loginForm" class="space-y-4 md:space-y-5" (ngSubmit)="submitForm()">
        <nz-form-item>
            <nz-form-control nzErrorTip="Please enter a valid email!">
                <nz-input-group nzPrefixIcon="mail" nzSize="large" class="rounded-lg">
                    <input type="text" nz-input formControlName="email" placeholder="Email" class="py-2 md:py-2.5"/>
                </nz-input-group>
            </nz-form-control>
        </nz-form-item>
        
        <nz-form-item>
            <nz-form-control nzErrorTip="Please enter your Password!">
                <nz-input-group nzPrefixIcon="lock" nzSize="large" [nzSuffix]="suffixTemplate" class="rounded-lg">
                    <input [type]="passwordVisible ? 'text' : 'password'" nz-input formControlName="password" placeholder="Password" [(ngModel)]="password" class="py-2 md:py-2.5"/>
                </nz-input-group>
                <ng-template #suffixTemplate>
                    <span
                      nz-icon
                      class="ant-input-password-icon cursor-pointer text-gray-500 hover:text-gray-700"
                      [nzType]="passwordVisible ? 'eye-invisible' : 'eye'"
                      (click)="passwordVisible = !passwordVisible"
                    ></span>
                </ng-template>
            </nz-form-control>
        </nz-form-item>
        
        <div class="flex justify-end mb-2">
            <a routerLink="../forgot-password" class="text-xs md:text-sm text-indigo-600 hover:text-indigo-800 transition-colors duration-300">Forgot password?</a>
        </div>
        
        <button nz-button class="w-full h-10 md:h-12 rounded-lg shadow-lg transform hover:scale-[1.02] transition-all duration-300 text-white font-medium text-sm md:text-base" 
            [class]="selectedUserType === 'Student' ? 'bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 border-0' : 'bg-gradient-to-r from-blue-600 to-indigo-500 hover:from-blue-700 hover:to-indigo-600 border-0'"
            [nzSize]="'large'" [nzType]="'primary'">
            Sign In
        </button>
    </form>
</div>
