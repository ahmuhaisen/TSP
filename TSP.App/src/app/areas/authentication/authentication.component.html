<div class="min-h-screen w-full flex items-center justify-center px-4 py-8 sm:p-6 md:p-8"
     [class.bg-gradient-to-br]="true" 
     [class.from-orange-500]="userType === 'Student'"
     [class.via-amber-400]="userType === 'Student'"
     [class.to-yellow-300]="userType === 'Student'"
     [class.from-blue-600]="userType === 'FacultyMember'"
     [class.via-indigo-500]="userType === 'FacultyMember'"
     [class.to-purple-400]="userType === 'FacultyMember'">
    <div class="w-full max-w-md flex flex-col items-center">
        <!-- Logo container -->
        <div class="mb-6 md:mb-8 transform hover:scale-105 transition-transform duration-300">
            <img src="tsp_logo_white.png" alt="TSP Logo" class="h-16 md:h-24" />
        </div>
        
        <!-- Card container with glass morphism effect -->
        <div class="w-full bg-white bg-opacity-20 backdrop-filter backdrop-blur-lg rounded-xl shadow-2xl overflow-hidden border border-white border-opacity-30">
            <!-- Content container -->
            <div class="bg-white rounded-lg m-1.5 p-4 sm:p-6 md:p-8">
                <router-outlet (activate)="onOutletActivated($event)" />
            </div>
        </div>
        
        <!-- Footer -->
        <div class="mt-4 md:mt-6 text-white text-xs md:text-sm text-opacity-80 text-center">
            © {{year}} - TSP
        </div>
    </div>
</div>
