<h1 class="text-xl font-extrabold text-center text-primary-dark py-3">System Admin Area</h1>

<div class="bg-slate-100 rounded-lg p-4 w-10/12 mx-auto">
    @for(society of societies; track $index) {
    <div class="p-2 bg-slate-200 rounded-lg">
        <p>
            <span class="text-white px-2 py-1 rounded-lg mr-2" [ngStyle]="{ 'background-color': society.themeColor }">{{$index + 1}}</span>
            <span class="font-bold">{{society.name}}</span>
        </p>
    </div>
    }@empty {
        <nz-empty></nz-empty>
    }
</div>
<router-outlet></router-outlet>
