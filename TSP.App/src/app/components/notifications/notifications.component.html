<div class="relative">
    <!-- Notifications -->
    <button (click)="toggleNotificationsDropdown()" type="button"
        class="p-2 mr-1 text-gray-500 rounded-lg hover:text-primary-dark-2 focus:ring-gray-300">
        <span class="sr-only">View notifications</span>
        <!-- Bell icon -->
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 14 20">
            <path d="M12.133 10.632v-1.8A5.406 5.406 0 0 0 7.979 3.57.946.946 0 0 0 8 3.464V1.1a1 1 0 0 0-2 0v2.364a.946.946 0 0 0 .021.106 5.406 5.406 0 0 0-4.154 5.262v1.8C1.867 13.018 0 13.614 0 14.807 0 15.4 0 16 .538 16h12.924C14 16 14 15.4 14 14.807c0-1.193-1.867-1.789-1.867-4.175ZM3.823 17a3.453 3.453 0 0 0 6.354 0H3.823Z" />
        </svg>
    </button>

    <!-- Dropdown menu -->
    <div *ngIf="isNotificationsDropdownOpen"
        class="z-50 right-[-110px] md:right-0 my-4 w-80 text-sm list-none bg-white rounded divide-y divide-gray-100 shadow"
        id="dropdown">
        <div class="block py-2 px-4 text-sm font-medium text-center text-gray-700 bg-gray-50">
            Notifications
        </div>
        <div>
            @for(line of notifications; track $index) {
                <app-notification-line [content]="line"/>
            }
        </div>
        <a href="#" class="block py-2 text-sm font-medium text-center text-gray-900 bg-gray-50 hover:bg-gray-100">
            <div class="inline-flex items-center">
                <nz-icon nzType="eye" class="mr-2 w-5 h-5"></nz-icon>
                View all
            </div>
        </a>
    </div>
</div>
