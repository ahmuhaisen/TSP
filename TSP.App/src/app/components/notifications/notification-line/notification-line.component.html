<a class="flex py-3 px-4 border-b hover:bg-gray-100">
    <div class="flex-shrink-0">
        <img class="w-11 h-11 rounded-full" [src]="content().image"
            alt="Bonnie Green avatar">
    </div>
    <div class="pl-3 w-full">
        <div class="text-gray-700 font-normal text-sm mb-1.5">
            <span class="font-semibold text-primary-dark">{{ content().username }}:</span>
            {{ content().message | truncate: 42 | capitalizefirst }}
        </div>
        <div class="text-xs font-medium text-gray-400">
            {{ content().date | date: 'dd/MM/yyyy HH:mm' }}
        </div>
    </div>
</a>
