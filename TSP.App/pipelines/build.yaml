steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/${_FIREBASE_PROJECT_ID}/firebase', './TSP.App/dockerfiles/firebase']
  
  - name: 'node:22.11'
    entrypoint: 'npm'
    args: ['install']
    dir: 'TSP.App'
  
  - name: 'node:22.11'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'TSP.App'
  
  - name: 'docker.io/firebase/firebase-tools'
    args: ['use', '${_FIREBASE_PROJECT_ID}', '--token', '${_FIREBASE_TOKEN}']
  
  - name: 'docker.io/firebase/firebase-tools'
    args: ['deploy', '--token', '${_FIREBASE_TOKEN}', '--only', 'hosting:the-societies-portal']

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY
